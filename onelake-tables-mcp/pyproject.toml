[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "onelake-tables-mcp"
version = "0.1.0"
description = "Read-only MCP server over the Fabric Lakehouse SQL analytics endpoint"
license = "MIT"
requires-python = ">=3.11,<3.12"
dependencies = [
  "mcp==2.1.1",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.5,<3",
  "azure-identity>=1.19,<2",
  "uvicorn>=0.31,<1",
  "mssql-python>=1.15,<2",
]

[project.scripts]
onelake-tables-mcp = "onelake_tables_mcp.__main__:main"

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/onelake_tables_mcp"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
