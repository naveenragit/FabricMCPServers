[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "foundry-eval"
version = "0.1.0"
description = "Run, attempt, step and evaluation records for comparing the three Foundry agent arms"
license = "MIT"
requires-python = ">=3.11,<3.12"
dependencies = ["pydantic>=2.12,<3"]

[project.optional-dependencies]
analysis = ["pandas>=2.2", "pyarrow>=15"]
traces = ["requests>=2.32", "azure-identity>=1.19"]

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.12,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/foundry_eval"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
