[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "wealth-management-mcp"
version = "0.2.0"
description = "Power BI MCP facade with an OSSIE-derived Fabric/DAX semantic profile"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.12"
dependencies = [
  "mcp==2.1.1",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.5,<3",
  "jsonschema>=4.23,<5",
  "httpx2>=2.5,<3",
  "azure-identity>=1.19,<2",
  # Required by azure-identity's async ManagedIdentityCredential transport.
  "aiohttp>=3.10,<4",
  "PyYAML>=6,<7",
  "uvicorn>=0.31,<1",
  # executeDaxQueries returns Apache Arrow IPC streams.
  "pyarrow>=17,<26",
]

[project.scripts]
wealth-management-mcp = "wealth_management_mcp.cli:main"
wealth-management-metadata = "wealth_management_mcp.cli:metadata_main"

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=1,<2", "ruff>=0.12,<1", "mypy>=1.15,<2", "types-PyYAML", "types-jsonschema"]
inspection = ["pbixray==0.15.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/wealth_management_mcp"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true

# pyarrow ships no py.typed marker.
[[tool.mypy.overrides]]
module = ["pyarrow.*"]
follow_untyped_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
